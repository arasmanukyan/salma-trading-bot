name: SALMA 7/24 Trading Bot

on:
  schedule:
    - cron: '2 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Cek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kutuphaneleri Yukle
        run: |
          pip install -r requirements.txt

      - name: Piyasalari Tara ve Veritabanini Guncelle
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python run_once.py

      - name: Guncel Veritabanini Kaydet
        run: |
          git config user.name "Trading Bot"
          git config user.email "bot@users.noreply.github.com"
          git add trading_bot.db
          git diff --staged --quiet || (git commit -m "Otomatik tarama guncellemesi" && git push)
